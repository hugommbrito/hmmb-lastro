<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMMB Finance – Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background: #f0eee9; }

  /* ── MUI-style tokens ── */
  :root {
    --bg0:     #060d1a;
    --bg1:     #0a1628;
    --bg2:     #0f1e35;
    --bg3:     #152540;
    --bg4:     #1b2e4e;
    --accent:  #4080ff;
    --accent2: #7aaeff;
    --accentd: #1a3a80;
    --success: #22c55e;
    --danger:  #f04747;
    --warn:    #f59e0b;
    --txt:     #d0e0f5;
    --txt2:    #6a8aaa;
    --txt3:    #3d5a7a;
    --border:  rgba(80,140,220,0.12);
    --border2: rgba(80,140,220,0.22);
  }

  /* ── MUI-look components ── */
  .mui-paper   { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
  .mui-paper-2 { background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; }
  .mui-chip    { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:11px; font-family:'Jost',sans-serif; font-size:11px; font-weight:500; letter-spacing:.3px; }
  .mui-btn     { display:inline-flex; align-items:center; justify-content:center; height:32px; padding:0 14px; border-radius:6px; font-family:'Jost',sans-serif; font-size:13px; font-weight:500; letter-spacing:.4px; cursor:pointer; border:none; gap:5px; }
  .mui-btn-outlined { background:transparent; border:1px solid var(--border2); color:var(--txt2); }
  .mui-btn-contained { background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(64,128,255,0.35); }
  .mui-btn-text { background:transparent; border:none; color:var(--accent2); }
  .mui-input   { background:var(--bg3); border:1px solid var(--border2); border-radius:6px; padding:8px 12px; font-family:'Jost',sans-serif; font-size:13px; color:var(--txt); width:100%; outline:none; }
  .mui-input::placeholder { color:var(--txt3); }
  .mui-select  { background:var(--bg3); border:1px solid var(--border2); border-radius:6px; padding:8px 12px; font-family:'Jost',sans-serif; font-size:13px; color:var(--txt); width:100%; }
  .mui-table   { width:100%; border-collapse:collapse; }
  .mui-table th { font-family:'Jost',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; color:var(--txt3); padding:10px 14px; border-bottom:1px solid var(--border); text-align:left; }
  .mui-table td { font-family:'Jost',sans-serif; font-size:13px; color:var(--txt); padding:12px 14px; border-bottom:1px solid var(--border); }
  .mui-table tr:last-child td { border-bottom:none; }
  .mui-table tr:hover td { background:var(--bg3); }
  .mui-divider { height:1px; background:var(--border); margin:0; }
  .mono { font-family:'Space Mono',monospace; }
  .pos { color: var(--success) !important; }
  .neg { color: var(--danger) !important; }
</style>
</head>
<body>
<script type="text/babel">

/* ─────────────── TWEAK DEFAULTS ─────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "ocean",
  "surface": "glass",
  "density": "compact"
}/*EDITMODE-END*/;

/* ─────────────── PALETTES ─────────────── */
const PALETTES = {
  ocean:   { accent:'#4080ff', accent2:'#7aaeff', accentd:'#1a3a80', success:'#22c55e', danger:'#f04747', bg0:'#060d1a', bg1:'#0a1628', bg2:'#0f1e35', bg3:'#152540', bg4:'#1b2e4e' },
  emerald: { accent:'#10b981', accent2:'#6ee7b7', accentd:'#064e3b', success:'#34d399', danger:'#f87171', bg0:'#020f0a', bg1:'#051a10', bg2:'#07261a', bg3:'#0a3322', bg4:'#0e4028' },
  violet:  { accent:'#7c3aed', accent2:'#c4b5fd', accentd:'#3b0764', success:'#22c55e', danger:'#f04747', bg0:'#08040f', bg1:'#110a1e', bg2:'#19102e', bg3:'#22163e', bg4:'#2b1c50' },
  amber:   { accent:'#d97706', accent2:'#fcd34d', accentd:'#451a03', success:'#22c55e', danger:'#f04747', bg0:'#0c0800', bg1:'#1a1100', bg2:'#261900', bg3:'#33230a', bg4:'#3d2c10' },
};

/* ─────────────── DYNAMIC STYLES ─────────────── */
const DynamicStyles = ({ palette, surface, density }) => {
  const p = PALETTES[palette] || PALETTES.ocean;
  const densityVars = {
    compact:     { cellPad:'8px 12px', cardPad:'10px 12px', fontSize:'12px', thSize:'10px' },
    comfortable: { cellPad:'12px 14px', cardPad:'14px 16px', fontSize:'13px', thSize:'11px' },
    spacious:    { cellPad:'17px 18px', cardPad:'18px 20px', fontSize:'14px', thSize:'12px' },
  }[density] || {};
  const d = densityVars;

  const surfaceCSS = {
    flat: `
      .mui-paper   { background: var(--bg2); border: 1px solid var(--border); box-shadow: none; }
      .mui-paper-2 { background: var(--bg1); border: 1px solid var(--border); box-shadow: none; }
    `,
    glass: `
      .mui-paper   { background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
      .mui-paper-2 { background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px); }
    `,
    outlined: `
      .mui-paper   { background: var(--bg2); border: 2px solid var(--border2); box-shadow: none; border-radius: 6px; }
      .mui-paper-2 { background: var(--bg1); border: 2px solid var(--border); box-shadow: none; }
    `,
  }[surface] || '';

  const css = `
    :root {
      --accent:  ${p.accent};
      --accent2: ${p.accent2};
      --accentd: ${p.accentd};
      --success: ${p.success};
      --danger:  ${p.danger};
      --bg0: ${p.bg0}; --bg1: ${p.bg1}; --bg2: ${p.bg2}; --bg3: ${p.bg3}; --bg4: ${p.bg4};
    }
    .mui-table td { padding: ${d.cellPad}; font-size: ${d.fontSize}; }
    .mui-table th { padding: ${d.cellPad}; font-size: ${d.thSize}; }
    .mui-paper > div, .stat-card { padding: ${d.cardPad}; }
    ${surfaceCSS}
  `;
  return <style dangerouslySetInnerHTML={{ __html: css }} />;
};

/* ─────────────── TREE DATA ─────────────── */
const TREE = [
  { id:'a', label:'Aposentadoria', type:'folder', open:true, children:[
    { id:'a1', label:'Renda Fixa', type:'folder', open:true, children:[
      { id:'a1a', label:'Tesouro IPCA+ 2035', type:'asset', tag:'TD' },
      { id:'a1b', label:'CDB Nubank 120% CDI', type:'asset', tag:'CDB' },
      { id:'a1c', label:'LCI Bradesco', type:'asset', tag:'LCI' },
    ]},
    { id:'a2', label:'Renda Variável', type:'folder', open:false, children:[
      { id:'a2a', label:'ITSA4', type:'asset', tag:'Ação' },
      { id:'a2b', label:'VALE3', type:'asset', tag:'Ação' },
      { id:'a2c', label:'KNRI11', type:'asset', tag:'FII' },
    ]},
  ]},
  { id:'b', label:'Reserva de Emergência', type:'folder', open:false, children:[
    { id:'b1', label:'Tesouro Selic 2027', type:'asset', tag:'TD' },
  ]},
  { id:'c', label:'Carteira Agressiva', type:'folder', open:false, children:[
    { id:'c1', label:'Internacional', type:'folder', open:false, children:[
      { id:'c1a', label:'VTI', type:'asset', tag:'ETF' },
      { id:'c1b', label:'AAPL', type:'asset', tag:'Ação' },
    ]},
    { id:'c2', label:'Cripto', type:'folder', open:false, children:[
      { id:'c2a', label:'Bitcoin', type:'asset', tag:'Cripto' },
    ]},
  ]},
];

/* ─────────────── SHARED UI ─────────────── */

const BrowserShell = ({ children }) => (
  <div style={{ width:1200, height:740, display:'flex', flexDirection:'column', background:VAR('bg0'), borderRadius:10, border:'2px solid #222', boxShadow:'6px 6px 0 #181818', overflow:'hidden', flexShrink:0 }}>
    <div style={{ height:40, background:'#111827', borderBottom:'1px solid #1e2a3a', display:'flex', alignItems:'center', padding:'0 14px', gap:8, flexShrink:0 }}>
      {['#ff5f57','#ffbd2e','#28c840'].map((c,i)=><div key={i} style={{ width:11,height:11,borderRadius:'50%',background:c }} />)}
      <div style={{ flex:1, background:'#0d1b2e', border:'1px solid #1e2a3a', borderRadius:5, height:24, display:'flex', alignItems:'center', paddingLeft:10, fontSize:11, color:'#3d5a7a', fontFamily:'Jost,sans-serif', letterSpacing:.3 }}>
        🔒 app.hmmb.finance
      </div>
    </div>
    <div style={{ flex:1, display:'flex', overflow:'hidden' }}>{children}</div>
  </div>
);

const VAR = k => `var(--${k})`;

// Sidebar with recursive tree
const TreeNode = ({ node, depth=0, activeId, onSelect }) => {
  const isFolder = node.type === 'folder';
  const isActive = activeId === node.id;
  const tagColors = { TD:'#4080ff', CDB:'#22c55e', LCI:'#a78bfa', FII:'#f59e0b', Ação:'#38bdf8', ETF:'#f97316', Cripto:'#fb923c' };
  return (
    <div>
      <div
        onClick={()=>onSelect(node.id)}
        style={{
          display:'flex', alignItems:'center', gap:6,
          padding:`6px 12px 6px ${14+depth*18}px`,
          cursor:'pointer', borderRadius:0,
          background: isActive ? 'rgba(64,128,255,0.15)' : 'transparent',
          borderLeft: isActive ? '2px solid var(--accent)' : '2px solid transparent',
          transition:'background .1s',
        }}
      >
        {isFolder ? (
          <span style={{ fontSize:12, color:'var(--txt3)', width:12, textAlign:'center', flexShrink:0 }}>
            {node.open !== false ? '▾' : '▸'}
          </span>
        ) : (
          <span style={{ width:12, fontSize:9, color:'var(--txt3)', flexShrink:0, textAlign:'center' }}>●</span>
        )}
        <span style={{ fontSize:13, fontWeight: isFolder ? 500 : 400, color: isActive ? 'var(--txt)' : 'var(--txt2)', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', letterSpacing:.2 }}>
          {node.label}
        </span>
        {!isFolder && node.tag && (
          <span className="mui-chip" style={{ background: (tagColors[node.tag]||'#4080ff')+'22', color: tagColors[node.tag]||'var(--accent2)', border:`1px solid ${(tagColors[node.tag]||'#4080ff')}44`, flexShrink:0 }}>{node.tag}</span>
        )}
      </div>
      {isFolder && node.open !== false && node.children?.map(ch=>(
        <TreeNode key={ch.id} node={ch} depth={depth+1} activeId={activeId} onSelect={onSelect} />
      ))}
    </div>
  );
};

const Sidebar = ({ activeId='a1', onSelect=()=>{} }) => (
  <div style={{ width:240, background:'var(--bg1)', borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column', flexShrink:0, height:'100%', overflow:'hidden' }}>
    {/* Logo */}
    <div style={{ padding:'16px 16px 12px', borderBottom:'1px solid var(--border)' }}>
      <div style={{ fontSize:17, fontWeight:700, color:'var(--txt)', letterSpacing:-.3 }}>HMMB</div>
      <div style={{ fontSize:11, color:'var(--txt3)', letterSpacing:1.5, textTransform:'uppercase', fontWeight:500 }}>Finance</div>
    </div>
    {/* Nav */}
    <div style={{ padding:'10px 0 6px' }}>
      {[{icon:'⊞', label:'Dashboard'},{icon:'◎', label:'Performance'},{icon:'≡', label:'Relatórios'}].map((n,i)=>(
        <div key={i} style={{ display:'flex',alignItems:'center',gap:10,padding:'8px 16px',cursor:'pointer', borderLeft: i===0?'2px solid var(--accent)':'2px solid transparent', background:i===0?'rgba(64,128,255,.12)':'transparent' }}>
          <span style={{ fontSize:14, color: i===0?'var(--accent)':'var(--txt3)' }}>{n.icon}</span>
          <span style={{ fontSize:13, fontWeight:500, color: i===0?'var(--txt)':'var(--txt2)', letterSpacing:.2 }}>{n.label}</span>
        </div>
      ))}
    </div>
    <div className="mui-divider" />
    {/* Tree label */}
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px 4px' }}>
      <span style={{ fontSize:10, fontWeight:600, textTransform:'uppercase', letterSpacing:1.2, color:'var(--txt3)' }}>Carteiras</span>
      <span style={{ fontSize:18, color:'var(--txt3)', cursor:'pointer', lineHeight:1 }}>+</span>
    </div>
    {/* Tree */}
    <div style={{ flex:1, overflowY:'auto', padding:'4px 0' }}>
      {TREE.map(n=><TreeNode key={n.id} node={n} activeId={activeId} onSelect={onSelect} />)}
      <div style={{ margin:'8px 12px', border:'1px dashed var(--border2)', borderRadius:6, padding:'7px 12px', textAlign:'center', cursor:'pointer' }}>
        <span style={{ fontSize:12, color:'var(--txt3)' }}>+ Nova carteira</span>
      </div>
    </div>
    {/* User */}
    <div style={{ padding:'12px 14px', borderTop:'1px solid var(--border)', display:'flex', alignItems:'center', gap:8 }}>
      <div style={{ width:28,height:28,borderRadius:'50%',background:'var(--accentd)',border:'2px solid var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,color:'var(--accent)',flexShrink:0 }}>M</div>
      <div>
        <div style={{ fontSize:13, fontWeight:500, color:'var(--txt)' }}>Matheus</div>
        <div style={{ fontSize:11, color:'var(--txt3)' }}>Pro</div>
      </div>
    </div>
  </div>
);

/* ─────────────── STAT CARD ─────────────── */
const StatCard = ({ label, value, sub, valueColor }) => (
  <div className="mui-paper" style={{ flex:1, padding:'14px 16px' }}>
    <div style={{ fontSize:11, fontWeight:500, textTransform:'uppercase', letterSpacing:.8, color:'var(--txt3)', marginBottom:6 }}>{label}</div>
    <div style={{ fontSize:20, fontWeight:600, color: valueColor||'var(--txt)', letterSpacing:-.3 }}>{value}</div>
    {sub && <div style={{ fontSize:12, color:'var(--txt3)', marginTop:4 }}>{sub}</div>}
  </div>
);

/* ═══════════════════════════════
   TELA 1 — DASHBOARD
═══════════════════════════════ */
const Screen_Dashboard = () => (
  <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--bg0)' }}>
    {/* Topbar */}
    <div style={{ height:50, borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', padding:'0 24px', justifyContent:'space-between', flexShrink:0 }}>
      <span style={{ fontSize:16, fontWeight:600, color:'var(--txt)', letterSpacing:-.2 }}>Dashboard</span>
      <div style={{ display:'flex', gap:8 }}>
        <button className="mui-btn mui-btn-outlined">+ Carteira</button>
        <button className="mui-btn mui-btn-contained">+ Ativo</button>
      </div>
    </div>
    <div style={{ flex:1, overflowY:'auto', padding:'22px 24px' }}>
      {/* KPIs */}
      <div style={{ display:'flex', gap:12, marginBottom:22 }}>
        <StatCard label="Patrimônio total" value="R$ 483.900" sub="↑ +2,1% este mês" />
        <StatCard label="Rentab. 12 meses" value="+14,3%" sub="vs CDI: +2,1 p.p." valueColor="var(--success)" />
        <StatCard label="Renda Fixa" value="47%" sub="meta: 50%" valueColor="var(--accent2)" />
        <StatCard label="Total de ativos" value="41" sub="em 3 carteiras-raiz" />
      </div>

      {/* Tree overview cards */}
      <div style={{ fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:1, color:'var(--txt3)', marginBottom:10 }}>Visão por Carteira</div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
        {[
          { label:'Aposentadoria', val:'R$ 312.400', rentab:'+12,6%', pos:true, color:'#4080ff',
            subs:[ {l:'Renda Fixa', v:'R$ 180k', p:58}, {l:'Renda Variável', v:'R$ 132k', p:42} ] },
          { label:'Reserva de Emergência', val:'R$ 48.000', rentab:'+10,8%', pos:true, color:'#22c55e',
            subs:[ {l:'Tesouro Selic', v:'R$ 48k', p:100} ] },
          { label:'Carteira Agressiva', val:'R$ 95.700', rentab:'-1,4%', pos:false, color:'#f04747',
            subs:[ {l:'Internacional', v:'R$ 63k', p:66}, {l:'Cripto', v:'R$ 33k', p:34} ] },
        ].map((g,i)=>(
          <div key={i} className="mui-paper" style={{ overflow:'hidden' }}>
            <div style={{ borderBottom:'1px solid var(--border)', padding:'12px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', background:g.color+'0d' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ width:9,height:9,borderRadius:2,background:g.color }} />
                <span style={{ fontSize:14, fontWeight:600, color:'var(--txt)' }}>{g.label}</span>
              </div>
              <div style={{ textAlign:'right' }}>
                <div style={{ fontSize:14, fontWeight:600, color:'var(--txt)' }}>{g.val}</div>
                <div style={{ fontSize:12, color: g.pos?'var(--success)':'var(--danger)' }}>{g.rentab} / 12m</div>
              </div>
            </div>
            <div style={{ padding:'10px 16px 14px' }}>
              {g.subs.map((s,si)=>(
                <div key={si} style={{ marginBottom: si<g.subs.length-1?10:0 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
                    <span style={{ fontSize:12, color:'var(--txt2)' }}>{s.l}</span>
                    <span style={{ fontSize:12, color:'var(--txt3)', fontFamily:'monospace' }}>{s.v}</span>
                  </div>
                  <div style={{ background:'var(--bg3)', borderRadius:100, height:5, overflow:'hidden' }}>
                    <div style={{ width:`${s.p}%`, height:'100%', background:g.color, borderRadius:100 }} />
                  </div>
                </div>
              ))}
              <div style={{ marginTop:12, display:'flex', justifyContent:'flex-end' }}>
                <button className="mui-btn mui-btn-text" style={{ fontSize:12 }}>Abrir →</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Recent table */}
      <div style={{ marginTop:22 }}>
        <div style={{ fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:1, color:'var(--txt3)', marginBottom:10 }}>Últimas Movimentações</div>
        <div className="mui-paper" style={{ overflow:'hidden' }}>
          <table className="mui-table">
            <thead><tr>
              <th>Ativo</th><th>Carteira</th><th>Tipo</th><th style={{textAlign:'right'}}>Valor</th><th style={{textAlign:'right'}}>Data</th>
            </tr></thead>
            <tbody>
              {[
                {a:'Tesouro IPCA+ 2035',c:'Aposentadoria / Renda Fixa',t:'Compra',v:'+R$ 10.000',d:'22 abr',pos:true},
                {a:'VALE3',c:'Aposentadoria / Renda Variável',t:'Compra',v:'+R$ 3.200',d:'20 abr',pos:true},
                {a:'Bitcoin',c:'Agressiva / Cripto',t:'Compra',v:'+R$ 5.000',d:'18 abr',pos:true},
                {a:'KNRI11',c:'Aposentadoria / Renda Variável',t:'Dividendo',v:'+R$ 480',d:'15 abr',pos:true},
              ].map((r,i)=>(
                <tr key={i}>
                  <td style={{ fontWeight:500 }}>{r.a}</td>
                  <td style={{ color:'var(--txt3)', fontSize:12 }}>{r.c}</td>
                  <td><span className="mui-chip" style={{ background:'var(--bg3)', color:'var(--txt2)', border:'1px solid var(--border2)' }}>{r.t}</span></td>
                  <td style={{ textAlign:'right', color: r.pos?'var(--success)':'var(--danger)', fontWeight:500 }}>{r.v}</td>
                  <td style={{ textAlign:'right', color:'var(--txt3)', fontSize:12 }}>{r.d}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
);

/* ═══════════════════════════════
   TELA 2 — DETALHE DE CARTEIRA (com sub-carteiras e ativos)
═══════════════════════════════ */
const Screen_Portfolio = () => (
  <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--bg0)' }}>
    <div style={{ height:50, borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', padding:'0 24px', justifyContent:'space-between', flexShrink:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <span style={{ fontSize:12, color:'var(--txt3)', cursor:'pointer' }}>Dashboard</span>
        <span style={{ color:'var(--border2)' }}>›</span>
        <span style={{ fontSize:12, color:'var(--txt3)', cursor:'pointer' }}>Aposentadoria</span>
        <span style={{ color:'var(--border2)' }}>›</span>
        <span style={{ fontSize:14, fontWeight:600, color:'var(--txt)' }}>Renda Fixa</span>
      </div>
      <div style={{ display:'flex', gap:8 }}>
        <button className="mui-btn mui-btn-outlined">⚙ Editar</button>
        <button className="mui-btn mui-btn-outlined">+ Sub-carteira</button>
        <button className="mui-btn mui-btn-contained">+ Ativo</button>
